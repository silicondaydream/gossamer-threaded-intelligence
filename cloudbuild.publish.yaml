substitutions:
  _REGION: us-central1
  _PY_REPO: python-packages

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: python:3.10-slim
    id: Build wheel
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir --upgrade pip build
        python -m build --wheel --outdir dist
        ls -lah dist

  - name: python:3.10-slim
    id: Smoke test wheel (local)
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir dist/*.whl
        python - <<'PY'
        # Verify that the new Phase 2+ subpackages actually ship in the wheel.
        # If any of these fails, find_packages() missed a subpackage (e.g.,
        # a dir was added without __init__.py).
        for mod in (
            'gossamer.algorithms.coordination.flocking',
            'gossamer.algorithms.coordination.flocking_gnn',
            'gossamer.algorithms.coordination.consensus_gnn',
            'gossamer.algorithms.coordination.dmb',
            'gossamer.algorithms.coordination.tfaco',
            'gossamer.algorithms.coordination.iccd',
            'gossamer.algorithms.coordination.hma',
            'gossamer.algorithms.coordination.milp_baseline',
            'gossamer.algorithms.coordination.primitive',
            'gossamer.crdt',
            'gossamer.graph',
            'gossamer.metrics.info',
            'gossamer.metrics.criticality',
            'gossamer.metrics.graph',
            'gossamer.benchmarks',
            'gossamer.utils.spatial',
            'gossamer.tasks',
            'gossamer.tasks.tasks',
            'gossamer.prediction',
            'gossamer.prediction.baselines',
            'gossamer.engine',
            'gossamer.algorithms.coordination.kernels',
            'gossamer.algorithms.coordination.baselines',
            'gossamer.communication',
            'gossamer.communication.delayed_view',
            'gossamer.benchmarks.faults',
        ):
            __import__(mod)
        # Symbol-level checks: importing a module cannot catch a function that
        # never shipped. Each of these is consumed by Maneuver.Map, so a wheel
        # missing one breaks the runner rather than this build.
        from gossamer.metrics.info import collective_transfer_entropy  # noqa: F401
        # policies.py imports these instead of reimplementing them (M6.6).
        from gossamer.algorithms.coordination.kernels import (  # noqa: F401
            boids_accel_edges, kdtree_edges,
        )
        # gossamer 0.8: the LAST algorithms to leave the runner. TF-ACO's dense-grid
        # stigmergy, HMA's depot steering, and the Levy/greedy DMB comparators all
        # lived in maneuver-map's policies.py — algorithm code in the orchestration
        # layer, which is the defect the extraction was meant to end and which had
        # quietly regrown. policies.py imports them at module scope now, so a wheel
        # without them breaks the runner, not this build. Assert them here.
        from gossamer.algorithms.coordination.baselines import (  # noqa: F401
            CoverageGrid, LevyState, greedy_coverage_accel, levy_flight_accel,
        )
        from gossamer.algorithms.coordination.tfaco import (  # noqa: F401
            DensePheromoneGrid, tfaco_accel,
        )
        from gossamer.algorithms.coordination.hma import (  # noqa: F401
            depot_steering_accel, ring_depots,
        )
        # gossamer 0.9: the orbital workload market (roadmap 4.1, N1's core).
        # The schedulers are the N1 experiment's whole comparator set, so a
        # wheel that ships without any one of them cannot run the experiment
        # that cites it.
        from gossamer.algorithms.coordination.orbital_market import (  # noqa: F401
            Job, MarketView, OrbitalMarketWorld, OrbitalWorldConfig,
            SatelliteConfig, auction_scheduler, cpsat_scheduler,
            fcfs_scheduler, greedy_soc_scheduler, poisson_workload,
            regime_label, scarcity_ratio,
        )
        # The benchmark harness steps through this, not a private copy (M6.7).
        from gossamer.engine import PhysicsEngine, ReferenceEngine  # noqa: F401
        # The only task whose Q actually responds to tau_sec (P4b).
        from gossamer.tasks import ALL_TASKS, TrackingRendezvousTask  # noqa: F401
        assert "tracking_rendezvous" in ALL_TASKS

        # The benchmark is the N2 moat and ships as a public package, but the gate
        # only ever checked that `gossamer.benchmarks` IMPORTS — so a wheel could
        # ship with the whole public API missing and pass.
        from gossamer.benchmarks import (  # noqa: F401
            ALL_SCENARIOS, DEFAULT_BASELINES, BenchmarkConfig,
            generate_leaderboard_md, leaderboard, run_benchmark,
        )
        assert set(ALL_SCENARIOS) == {
            "dispersal", "rendezvous", "coverage", "leader_follower", "byzantine",
            "vicsek_transition",
        }, ALL_SCENARIOS
        assert set(DEFAULT_BASELINES) == {
            "random", "gossamer_flocking", "greedy", "vicsek_alignment"
        }, DEFAULT_BASELINES

        # ByzantineScenario was a NO-OP: it marked its adversaries and the harness
        # never read the marks, so the "byzantine" leaderboard row was a plain
        # rendezvous run. The corruption hook is what makes it adversarial at all,
        # and it is reached through the Scenario base class — exactly the kind of
        # surface that fails silently on a stale wheel and reads as a result.
        import numpy as np
        from gossamer.benchmarks.scenarios import ByzantineScenario
        _sc = ByzantineScenario(byzantine_fraction=1.0, adversary="inverted")
        _sc.init_state(np.random.default_rng(0), num_agents=4, bound=10.0)
        assert np.allclose(
            _sc.corrupt_actions(np.ones((4, 3)), np.random.default_rng(0), None), -1.0
        ), "ByzantineScenario is not corrupting actions — the benchmark row is a lie"

        # The adapter that lets the benchmark run on the real substrate. Its absence
        # is why every benchmark number to date came from ReferenceEngine.
        from gossamer.leviathan_engine import LeviathanEngine  # noqa: F401
        from gossamer.benchmarks.cli import main as _bench_main  # noqa: F401

        # THE DELAYED VIEW (0.11.0). This is the mechanism the entire DCC corpus
        # measures, and it lived in the Maneuver.Map runner until now — which is
        # precisely why it needs a gate here: `runner.py` imports it from the WHEEL,
        # so a wheel without it does not degrade, it fails to start the worker after
        # the job array has been queued and billed. `orrery.benchmarks.dcc_delay`
        # imports it too, so a stale wheel silently removes the benchmark's crown
        # -jewel row as well.
        from gossamer.communication import (  # noqa: F401
            DelayedView, gating_enabled, resolve_delay_steps)
        # Behavioural, not symbol-level: the per-agent delay axis (roadmap 20) adds
        # no importable name of its own — it is a keyword argument — so only
        # exercising it can tell a 0.11.0 wheel from a 0.10.0 one. The uniform case
        # must also still reduce to the scalar path, which is the property that
        # keeps every published delay number where it is.
        _n = 3
        _v = DelayedView({}, dt=1.0, num_agents=_n, prediction=None,
                         rng=np.random.default_rng(0),
                         delay_steps_per_agent=np.array([0, 1, 2]))
        for _s in range(4):
            _vp, _, _ = _v.perceive(np.full((_n, 3), float(_s)), np.zeros((_n, 3)))
        assert list(_vp[:, 0]) == [3.0, 2.0, 1.0], (
            f"per-agent delay offsets are not being applied ({_vp[:, 0]}) — this "
            f"wheel predates 0.11.0 and the measured delay axis is a no-op")

        # The standardized fault models (0.11.0). A SET assertion, like the scenario
        # and baseline registries above: adding a fault model is a deliberate
        # two-line change and losing one is a build failure. A missing fault row does
        # not degrade — it silently stops being evaluated, and the leaderboard still
        # looks complete.
        from gossamer.benchmarks.faults import (  # noqa: F401
            FAULT_MODELS, FaultModel, NoFaultsFiredError)
        assert set(FAULT_MODELS) == {
            "none", "fail_stop", "seu", "seu_significant", "seu_unprotected",
        }, f"fault model registry drifted: {sorted(FAULT_MODELS)}"
        # And the anti-no-op guard must actually refuse. This is the property the
        # whole registry exists for: a fault row that fired nothing must not be
        # reportable, because a fault-free run under a fault label reads as
        # robustness (this is the ByzantineScenario failure, generalized).
        _refused = False
        try:
            FAULT_MODELS["seu"].verify({"seu_flips_total": 0.0})
        except NoFaultsFiredError:
            _refused = True
        assert _refused, ("a fault model with ZERO fired faults was accepted — the "
                          "no-op guard is not wired")

        # The single-substrate story (suite 0.2.0). `default_engine()` must resolve to
        # the COMPILED engine, never the pure-NumPy reference — the wheel is what the
        # papers pin, and a benchmark defaulting to a substrate the papers do not use is
        # the hole this closed. We only assert the symbol and the suite version here:
        # this build step has no compiled engine, and default_engine() rightly raises
        # without one, which is itself the behaviour under test.
        from gossamer.benchmarks import SUITE_VERSION, default_engine
        assert SUITE_VERSION == "0.3.0", f"benchmark suite version drifted: {SUITE_VERSION}"

        # --- suite 0.3.0: the two definition changes the 0.2.0 reference run found ---
        # Both are asserted BEHAVIOURALLY and engine-free, because both regress
        # SILENTLY: a wheel that loses either still produces a full, plausible
        # leaderboard, which is the only failure mode this gate exists for.

        # (1) A scenario owns its required config. `vicsek_transition` is the
        # substrate-validation row, and at the suite default it is ~100x too sparse in
        # 3-D to order at all — it returned psi = 0.052 against a disordered floor of
        # 0.045, a row sitting ON the floor that the cross-baseline discrimination
        # check passed. If this requirement stops being declared or stops being
        # applied, that degenerate row comes back and reads as "the substrate cannot
        # order".
        from gossamer.benchmarks import ScenarioContext, apply_required_config
        from gossamer.benchmarks.scenarios import ALL_SCENARIOS as _SC
        _vic = _SC["vicsek_transition"]()
        assert _vic.required_config == {"num_agents": 200, "bound": 22.0}, (
            f"vicsek_transition no longer declares its validated config "
            f"({_vic.required_config!r}) — the substrate-validation row will run at a "
            f"density where nothing can order and report it as a substrate failure")
        _applied = apply_required_config(_vic, BenchmarkConfig())
        assert (_applied.num_agents, _applied.bound) == (200, 22.0), (
            "the harness is not APPLYING required_config — declaring it is only half "
            "the fix; this is the trust-the-caller arrangement that failed the first time")

        # (2) `coverage` scores the simulated VOLUME. It used to index (y, x) only —
        # a 2-D shadow of a 3-D domain — which made vertical travel free and left the
        # row with no headroom: three of four baselines within 4% of the ceiling and
        # the greedy walker answering no fault rung at all. Asserted as a property of
        # the ENVIRONMENT rather than an expected score, because a metric is the one
        # component with no independent check on it: two agents differing solely in
        # altitude must occupy different cells.
        _cov = _SC["coverage"]()
        _cov.init_state(np.random.default_rng(0), 2, 100.0)
        _p = np.array([[0.0, 0.0, -90.0], [0.0, 0.0, 90.0]])
        _cov.step_reward(_p, np.zeros_like(_p), _p, np.zeros_like(_p),
                         ScenarioContext(step=0, total_steps=1, dt=0.1))
        assert len(_cov._visited) == 2, (
            "coverage is collapsing the z axis — two agents separated only in altitude "
            "scored as one cell. This is the 2-D projection that saturated the row and "
            "hid 60 destroyed runs as healthy ones")
        # And a destroyed run must not report a plausible ratio. Occupancy is an
        # accumulator, so a swarm annihilated mid-run still holds the coverage it
        # earned while alive — the fault-reduction inversion arriving through the
        # metric instead of the CI.
        _dead = _p.copy(); _dead[0] = np.nan
        _cov.step_reward(_dead, np.zeros_like(_dead), _p, np.zeros_like(_p),
                         ScenarioContext(step=1, total_steps=2, dt=0.1))
        assert _cov.terminal_metric([]) != _cov.terminal_metric([]), (
            "coverage returned a finite ratio for a run whose state went non-finite — "
            "a destroyed swarm is being reported as a healthy one")
        # BEHAVIOURAL, not a source scan: this build step has no compiled engine, so
        # a default_engine() that RETURNS anything here has silently fallen back to a
        # substrate the papers do not use — and that swap leaves no trace in the number
        # it produces. Raising is the contract.
        try:
            _eng = default_engine()
        except ImportError:
            pass
        else:
            raise AssertionError(
                f"default_engine() returned {type(_eng).__name__} in an environment with "
                f"no compiled engine — it has grown a fallback, which is the exact silent "
                f"substrate swap the Leviathan default exists to prevent")
        print("✅ Import OK")
        PY

  - name: python:3.10-slim
    id: Upload to Artifact Registry Python repo
    entrypoint: bash
    env:
      - TWINE_REPOSITORY_URL=https://$_REGION-python.pkg.dev/$PROJECT_ID/$_PY_REPO/
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir twine keyrings.google-artifactregistry-auth
        # Note: Artifact Registry's PyPI endpoint does NOT support
        # --skip-existing. Re-uploading an existing version returns 400; bump
        # the version in setup.py instead of relying on idempotent upload.
        python -m twine upload --non-interactive dist/*

images: []
